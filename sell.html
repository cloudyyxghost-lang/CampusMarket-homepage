<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sell Item - CampusMarket</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>


<body class="bg-light">


<div class="container py-4">


    <!-- HEADER -->

    <div
        class="d-flex justify-content-between align-items-center mb-4"
    >

        <a
            href="index.html"
            class="text-decoration-none text-dark"
        >

            <h3 class="fw-bold mb-0">

                <i
                    class="bi bi-mortarboard-fill text-primary"
                ></i>

                CampusMarket

            </h3>

        </a>


        <div>

            <a
                href="seller-dashboard.html"
                class="btn btn-outline-dark"
            >

                <i class="bi bi-speedometer2"></i>

                Dashboard

            </a>

        </div>

    </div>



    <!-- PAGE -->

    <div class="row justify-content-center">

        <div class="col-lg-8">


            <div
                class="card border-0 shadow-sm rounded-4"
            >

                <div class="card-body p-4 p-md-5">


                    <h1 class="fw-bold mb-2">
                        Create a Listing
                    </h1>


                    <p class="text-secondary mb-4">
                        Sell an item to students in your school community.
                    </p>



                    <!-- FORM -->

                    <form id="sellForm">


                        <!-- NAME -->

                        <div class="mb-4">

                            <label
                                for="itemName"
                                class="form-label fw-semibold"
                            >
                                Item Name
                            </label>

                            <input
                                type="text"
                                id="itemName"
                                class="form-control form-control-lg"
                                placeholder="e.g. MacBook Air"
                                required
                            >

                        </div>



                        <!-- CATEGORY -->

                        <div class="mb-4">

                            <label
                                for="category"
                                class="form-label fw-semibold"
                            >
                                Category
                            </label>

                            <select
                                id="category"
                                class="form-select form-select-lg"
                                required
                            >

                                <option value="">
                                    Select category
                                </option>

                                <option value="Computers">
                                    Computers
                                </option>

                                <option value="Books">
                                    Books
                                </option>

                                <option value="Uniform">
                                    Uniform
                                </option>

                                <option value="Backpacks">
                                    Backpacks
                                </option>

                                <option value="School Supplies">
                                    School Supplies
                                </option>

                                <option value="Games">
                                    Games
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>



                        <!-- PRICE -->

                        <div class="mb-4">

                            <label
                                for="price"
                                class="form-label fw-semibold"
                            >
                                Price
                            </label>

                            <div class="input-group input-group-lg">

                                <span class="input-group-text">
                                    $
                                </span>

                                <input
                                    type="number"
                                    id="price"
                                    class="form-control"
                                    min="0"
                                    step="0.01"
                                    placeholder="0.00"
                                    required
                                >

                            </div>

                        </div>



                        <!-- CONDITION -->

                        <div class="mb-4">

                            <label
                                for="condition"
                                class="form-label fw-semibold"
                            >
                                Condition
                            </label>

                            <select
                                id="condition"
                                class="form-select form-select-lg"
                                required
                            >

                                <option value="">
                                    Select condition
                                </option>

                                <option value="New">
                                    New
                                </option>

                                <option value="Like New">
                                    Like New
                                </option>

                                <option value="Good">
                                    Good
                                </option>

                                <option value="Fair">
                                    Fair
                                </option>

                            </select>

                        </div>



                        <!-- LOCATION -->

                        <div class="mb-4">

                            <label
                                for="location"
                                class="form-label fw-semibold"
                            >
                                Location
                            </label>

                            <input
                                type="text"
                                id="location"
                                class="form-control form-control-lg"
                                placeholder="Los Angeles"
                                required
                            >

                        </div>



                        <!-- DESCRIPTION -->

                        <div class="mb-4">

                            <label
                                for="description"
                                class="form-label fw-semibold"
                            >
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="5"
                                placeholder="Describe your item..."
                                required
                            ></textarea>

                        </div>



                        <!-- IMAGE URL -->

                        <div class="mb-4">

                            <label
                                for="imageUrl"
                                class="form-label fw-semibold"
                            >
                                Image URL
                            </label>

                            <input
                                type="url"
                                id="imageUrl"
                                class="form-control form-control-lg"
                                placeholder="https://example.com/image.jpg"
                            >

                            <div class="form-text">

                                Paste the URL of your item image.

                            </div>

                        </div>



                        <!-- IMAGE PREVIEW -->

                        <div
                            id="imagePreviewContainer"
                            class="mb-4 d-none"
                        >

                            <img
                                id="imagePreview"
                                src=""
                                alt="Item preview"
                                class="rounded-4 border"
                                style="
                                    width:200px;
                                    height:200px;
                                    object-fit:cover;
                                "
                            >

                        </div>



                        <!-- ERROR -->

                        <div
                            id="errorMessage"
                            class="alert alert-danger d-none"
                        ></div>



                        <!-- SUCCESS -->

                        <div
                            id="successMessage"
                            class="alert alert-success d-none"
                        ></div>



                        <!-- BUTTONS -->

                        <div class="d-flex gap-3">

                            <a
                                href="seller-dashboard.html"
                                class="btn btn-outline-secondary btn-lg flex-grow-1"
                            >
                                Cancel
                            </a>


                            <button
                                type="submit"
                                id="submitButton"
                                class="btn btn-primary btn-lg flex-grow-1"
                            >

                                <i class="bi bi-plus-lg"></i>

                                Create Listing

                            </button>

                        </div>


                    </form>

                </div>

            </div>

        </div>

    </div>


</div>


<script
    type="module"
    src="js/sell.js"
></script>


</body>

</html>
