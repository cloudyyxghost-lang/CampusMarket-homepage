<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC PAGE SETUP
    ====================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Store - CampusMarket</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- =====================================================
         MAIN PAGE
    ====================================================== -->

    <div class="container-fluid min-vh-100">


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav
            class="navbar navbar-expand-lg bg-white border-bottom px-3 px-md-5 py-3"
        >

            <div class="container-fluid">


                <!-- =========================================
                     LOGO
                ========================================== -->

                <a
                    href="index.html"
                    class="navbar-brand d-flex align-items-center gap-2 fw-bold"
                    style="
                        font-family: 'Space Grotesk', sans-serif;
                        font-size: 25px;
                    "
                >

                    <span
                        class="d-flex align-items-center justify-content-center rounded-3 text-white"
                        style="
                            width: 42px;
                            height: 42px;
                            background-color: #635bff;
                        "
                    >

                        <i class="bi bi-mortarboard-fill"></i>

                    </span>


                    CampusMarket

                </a>


                <!-- =========================================
                     MOBILE BUTTON
                ========================================== -->

                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#sellerNavigation"
                >

                    <span class="navbar-toggler-icon"></span>

                </button>


                <!-- =========================================
                     NAVIGATION LINKS
                ========================================== -->

                <div
                    class="collapse navbar-collapse justify-content-end"
                    id="sellerNavigation"
                >

                    <div
                        class="d-flex align-items-center gap-3 mt-3 mt-lg-0"
                    >

                        <a
                            href="index.html"
                            class="btn btn-outline-secondary rounded-3"
                        >

                            <i class="bi bi-shop me-1"></i>

                            Marketplace

                        </a>


                        <button
                            id="logoutButton"
                            type="button"
                            class="btn btn-link text-dark text-decoration-none"
                        >

                            Logout

                        </button>

                    </div>

                </div>

            </div>

        </nav>


        <!-- =================================================
             SELLER CONTENT
        ================================================== -->

        <main
            class="container-fluid px-3 px-md-5 py-4"
            style="max-width: 1500px;"
        >


            <!-- =================================================
                 HEADER
            ================================================== -->

            <div
                class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"
            >

                <div>

                    <h1
                        class="fw-bold mb-1"
                        style="
                            font-family: 'Space Grotesk', sans-serif;
                        "
                    >
                        My Store
                    </h1>


                    <p class="text-secondary mb-0">

                        Manage your items and listings.

                    </p>

                </div>


                <!-- CREATE LISTING BUTTON -->

                <a
                    href="create-listing.html"
                    class="btn btn-lg text-white rounded-3 px-4"
                    style="
                        background-color: #635bff;
                    "
                >

                    <i class="bi bi-plus-lg me-2"></i>

                    Add Product

                </a>

            </div>


            <!-- =================================================
                 SUMMARY CARDS
            ================================================== -->

            <div class="row g-3 mb-4">


                <!-- TOTAL PRODUCTS -->

                <div class="col-md-4">

                    <div
                        class="card border-0 shadow-sm rounded-4 h-100"
                    >

                        <div class="card-body p-4">

                            <div
                                class="d-flex justify-content-between align-items-center"
                            >

                                <div>

                                    <div
                                        class="small text-secondary mb-1"
                                    >
                                        Total Listings
                                    </div>


                                    <div
                                        id="totalListings"
                                        class="display-6 fw-bold"
                                    >
                                        0
                                    </div>

                                </div>


                                <div
                                    class="rounded-4 d-flex align-items-center justify-content-center"
                                    style="
                                        width: 52px;
                                        height: 52px;
                                        background-color: #f0efff;
                                        color: #635bff;
                                    "
                                >

                                    <i
                                        class="bi bi-box-seam fs-4"
                                    ></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ACTIVE PRODUCTS -->

                <div class="col-md-4">

                    <div
                        class="card border-0 shadow-sm rounded-4 h-100"
                    >

                        <div class="card-body p-4">

                            <div
                                class="d-flex justify-content-between align-items-center"
                            >

                                <div>

                                    <div
                                        class="small text-secondary mb-1"
                                    >
                                        Active Listings
                                    </div>


                                    <div
                                        id="activeListings"
                                        class="display-6 fw-bold"
                                    >
                                        0
                                    </div>

                                </div>


                                <div
                                    class="rounded-4 d-flex align-items-center justify-content-center"
                                    style="
                                        width: 52px;
                                        height: 52px;
                                        background-color: #e8f8ef;
                                        color: #198754;
                                    "
                                >

                                    <i
                                        class="bi bi-check-circle fs-4"
                                    ></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- SOLD -->

                <div class="col-md-4">

                    <div
                        class="card border-0 shadow-sm rounded-4 h-100"
                    >

                        <div class="card-body p-4">

                            <div
                                class="d-flex justify-content-between align-items-center"
                            >

                                <div>

                                    <div
                                        class="small text-secondary mb-1"
                                    >
                                        Sold
                                    </div>


                                    <div
                                        id="soldListings"
                                        class="display-6 fw-bold"
                                    >
                                        0
                                    </div>

                                </div>


                                <div
                                    class="rounded-4 d-flex align-items-center justify-content-center"
                                    style="
                                        width: 52px;
                                        height: 52px;
                                        background-color: #fff4df;
                                        color: #b06b00;
                                    "
                                >

                                    <i
                                        class="bi bi-check2-all fs-4"
                                    ></i>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 PRODUCTS AREA
            ================================================== -->

            <div
                class="card border-0 shadow-sm rounded-4 overflow-hidden"
            >


                <!-- =============================================
                     PRODUCTS HEADER
                ============================================== -->

                <div
                    class="card-header bg-white border-0 px-4 py-4"
                >

                    <div
                        class="d-flex flex-wrap justify-content-between align-items-center gap-3"
                    >

                        <div>

                            <h4
                                class="fw-bold mb-1"
                                style="
                                    font-family: 'Space Grotesk', sans-serif;
                                "
                            >
                                Products
                            </h4>


                            <p
                                class="small text-secondary mb-0"
                            >
                                Items you are currently selling.
                            </p>

                        </div>


                        <!-- SEARCH -->

                        <div
                            class="input-group"
                            style="max-width: 320px;"
                        >

                            <span
                                class="input-group-text bg-light border-end-0"
                            >

                                <i class="bi bi-search"></i>

                            </span>


                            <input
                                id="listingSearch"
                                type="text"
                                class="form-control bg-light border-start-0"
                                placeholder="Search products"
                            >

                        </div>

                    </div>

                </div>


                <!-- =============================================
                     FILTER BAR
                ============================================== -->

                <div
                    class="border-top border-bottom px-4 py-3"
                >

                    <div
                        class="d-flex flex-wrap align-items-center gap-2"
                    >

                        <button
                            type="button"
                            class="btn btn-sm btn-dark rounded-pill filter-button"
                            data-filter="all"
                        >
                            All Products
                        </button>


                        <button
                            type="button"
                            class="btn btn-sm btn-outline-secondary rounded-pill filter-button"
                            data-filter="active"
                        >
                            Active
                        </button>


                        <button
                            type="button"
                            class="btn btn-sm btn-outline-secondary rounded-pill filter-button"
                            data-filter="draft"
                        >
                            Draft
                        </button>


                        <button
                            type="button"
                            class="btn btn-sm btn-outline-secondary rounded-pill filter-button"
                            data-filter="sold"
                        >
                            Sold
                        </button>

                    </div>

                </div>


                <!-- =============================================
                     TABLE
                ============================================== -->

                <div class="table-responsive">

                    <table
                        class="table align-middle mb-0"
                    >

                        <thead class="table-light">

                            <tr>

                                <th class="px-4 py-3">
                                    Product
                                </th>

                                <th class="py-3">
                                    Category
                                </th>

                                <th class="py-3">
                                    Price
                                </th>

                                <th class="py-3">
                                    Status
                                </th>

                                <th class="py-3">
                                    School
                                </th>

                                <th class="py-3 text-end px-4">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="listingTableBody"
                        >

                            <!--
                                Firestore listings
                                will appear here.
                            -->

                        </tbody>

                    </table>

                </div>


                <!-- =============================================
                     EMPTY STATE
                ============================================== -->

                <div
                    id="emptyListings"
                    class="text-center py-5"
                >

                    <div
                        class="d-flex align-items-center justify-content-center rounded-circle mx-auto mb-3"
                        style="
                            width: 75px;
                            height: 75px;
                            background-color: #f0efff;
                            color: #635bff;
                        "
                    >

                        <i
                            class="bi bi-box-seam fs-2"
                        ></i>

                    </div>


                    <h5 class="fw-bold">
                        No products yet
                    </h5>


                    <p class="text-secondary mb-4">

                        Create your first listing
                        and start selling.

                    </p>


                    <a
                        href="create-listing.html"
                        class="btn text-white rounded-3 px-4"
                        style="
                            background-color: #635bff;
                        "
                    >

                        <i class="bi bi-plus-lg me-2"></i>

                        Add Product

                    </a>

                </div>

            </div>

        </main>

    </div>


    <!-- =====================================================
         BOOTSTRAP JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         SELLER DASHBOARD JS
    ====================================================== -->

    <script
        type="module"
        src="js/seller-dashboard.js"
    ></script>

</body>

</html>
