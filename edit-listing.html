<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Listing - CampusMarket</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

</head>


<body class="bg-light">


<div class="container py-4">


    <!-- HEADER -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <a
            href="seller-dashboard.html"
            class="text-decoration-none text-dark"
        >

            <h3 class="fw-bold mb-0">
                <i class="bi bi-mortarboard-fill text-primary"></i>
                CampusMarket
            </h3>

        </a>


        <a
            href="seller-dashboard.html"
            class="btn btn-outline-dark"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Dashboard

        </a>

    </div>



    <!-- TITLE -->

    <div class="mb-4">

        <h1 class="fw-bold">
            Edit Listing
        </h1>

        <p class="text-secondary">
            Update your item information.
        </p>

    </div>



    <!-- FORM -->

    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4 p-md-5">


            <form id="editListingForm">


                <!-- ITEM NAME -->

                <div class="mb-4">

                    <label
                        for="itemName"
                        class="form-label fw-semibold"
                    >
                        Item Name
                    </label>

                    <input
                        type="text"
                        class="form-control form-control-lg"
                        id="itemName"
                        required
                    >

                </div>



                <!-- CATEGORY -->

                <div class="mb-4">

                    <label
                        for="category"
                        class="form-label fw-semibold"
                    >
                        Category
                    </label>

                    <select
                        class="form-select form-select-lg"
                        id="category"
                        required
                    >

                        <option value="">
                            Select category
                        </option>

                        <option value="Computers">
                            Computers
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Uniform">
                            Uniform
                        </option>

                        <option value="Backpacks">
                            Backpacks
                        </option>

                        <option value="School Supplies">
                            School Supplies
                        </option>

                        <option value="Games">
                            Games
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>



                <!-- PRICE -->

                <div class="mb-4">

                    <label
                        for="price"
                        class="form-label fw-semibold"
                    >
                        Price
                    </label>

                    <div class="input-group input-group-lg">

                        <span class="input-group-text">
                            $
                        </span>

                        <input
                            type="number"
                            class="form-control"
                            id="price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>

                </div>



                <!-- CONDITION -->

                <div class="mb-4">

                    <label
                        for="condition"
                        class="form-label fw-semibold"
                    >
                        Condition
                    </label>

                    <select
                        class="form-select form-select-lg"
                        id="condition"
                        required
                    >

                        <option value="">
                            Select condition
                        </option>

                        <option value="New">
                            New
                        </option>

                        <option value="Like New">
                            Like New
                        </option>

                        <option value="Good">
                            Good
                        </option>

                        <option value="Fair">
                            Fair
                        </option>

                    </select>

                </div>



                <!-- LOCATION -->

                <div class="mb-4">

                    <label
                        for="location"
                        class="form-label fw-semibold"
                    >
                        Location
                    </label>

                    <input
                        type="text"
                        class="form-control form-control-lg"
                        id="location"
                        placeholder="Los Angeles"
                        required
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="mb-4">

                    <label
                        for="description"
                        class="form-label fw-semibold"
                    >
                        Description
                    </label>

                    <textarea
                        class="form-control"
                        id="description"
                        rows="6"
                        placeholder="Describe your item..."
                        required
                    ></textarea>

                </div>



                <!-- IMAGE URL -->

                <div class="mb-4">

                    <label
                        for="imageUrl"
                        class="form-label fw-semibold"
                    >
                        Image URL
                    </label>

                    <input
                        type="url"
                        class="form-control form-control-lg"
                        id="imageUrl"
                        placeholder="https://example.com/image.jpg"
                    >

                    <div class="form-text">

                        Enter the URL of your item image.

                    </div>

                </div>



                <!-- IMAGE PREVIEW -->

                <div
                    id="imagePreviewContainer"
                    class="mb-4 d-none"
                >

                    <label class="form-label fw-semibold">
                        Image Preview
                    </label>

                    <div>

                        <img
                            id="imagePreview"
                            src=""
                            alt="Item preview"
                            class="rounded-4 border"
                            style="
                                width:200px;
                                height:200px;
                                object-fit:cover;
                            "
                        >

                    </div>

                </div>



                <!-- STATUS -->

                <div class="mb-4">

                    <label
                        for="status"
                        class="form-label fw-semibold"
                    >
                        Listing Status
                    </label>

                    <select
                        class="form-select form-select-lg"
                        id="status"
                    >

                        <option value="active">
                            Active
                        </option>

                        <option value="sold">
                            Sold
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                    </select>

                </div>



                <!-- ERROR -->

                <div
                    id="errorMessage"
                    class="alert alert-danger d-none"
                ></div>



                <!-- SUCCESS -->

                <div
                    id="successMessage"
                    class="alert alert-success d-none"
                ></div>



                <!-- BUTTONS -->

                <div class="d-flex gap-3">

                    <a
                        href="seller-dashboard.html"
                        class="btn btn-outline-secondary btn-lg flex-grow-1"
                    >

                        Cancel

                    </a>


                    <button
                        type="submit"
                        class="btn btn-primary btn-lg flex-grow-1"
                        id="saveButton"
                    >

                        <i class="bi bi-check-lg"></i>

                        Save Changes

                    </button>

                </div>


            </form>


        </div>

    </div>


</div>



<script
    type="module"
    src="js/edit-listing.js"
></script>


</body>

</html>
