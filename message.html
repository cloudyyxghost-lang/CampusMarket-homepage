<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conversation - CampusMarket</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div
    class="container-fluid border border-dark rounded-5 min-vh-100 my-3 bg-white"
    style="width: calc(100% - 48px);"
>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav
        class="navbar navbar-expand-lg px-3 px-md-5 py-4"
    >

        <div class="container-fluid px-0">


            <a
                href="index.html"
                class="navbar-brand d-flex align-items-center gap-2 fw-bold"
                style="
                    font-family:'Space Grotesk',sans-serif;
                    font-size:26px;
                "
            >

                <span
                    class="d-flex align-items-center justify-content-center rounded-3 text-white"
                    style="
                        width:42px;
                        height:42px;
                        background-color:#635bff;
                    "
                >

                    <i class="bi bi-mortarboard-fill"></i>

                </span>

                CampusMarket

            </a>


            <a
                href="messages.html"
                class="btn btn-outline-dark rounded-3"
            >

                <i class="bi bi-arrow-left me-1"></i>

                Messages

            </a>

        </div>

    </nav>


    <!-- =====================================================
         CONVERSATION
    ====================================================== -->

    <main
        class="container px-3 px-md-5 pb-5"
        style="max-width:900px;"
    >


        <!-- ITEM HEADER -->

        <div
            id="conversationHeader"
            class="card border-0 shadow-sm rounded-4 mb-3"
        >

            <div
                class="card-body p-3 p-md-4"
            >

                <!-- Filled by JS -->

                <div
                    class="text-secondary"
                >

                    Loading conversation...

                </div>

            </div>

        </div>


        <!-- =================================================
             MESSAGES
        ================================================== -->

        <div
            id="messageContainer"
            class="card border-0 shadow-sm rounded-4"
        >

            <div
                id="messagesList"
                class="card-body p-3 p-md-4"
                style="
                    min-height:450px;
                    max-height:600px;
                    overflow-y:auto;
                "
            >

                <!-- Messages inserted here -->

            </div>


            <!-- ERROR -->

            <div
                id="messageError"
                class="alert alert-danger mx-3 d-none"
            ></div>


            <!-- =================================================
                 MESSAGE INPUT
            ================================================== -->

            <div
                class="border-top p-3"
            >

                <form
                    id="messageForm"
                    class="d-flex gap-2"
                >

                    <input
                        type="text"
                        id="messageInput"
                        class="form-control form-control-lg rounded-4"
                        placeholder="Type a message..."
                        autocomplete="off"
                    >


                    <button
                        type="submit"
                        class="btn text-white rounded-4 px-4"
                        style="
                            background-color:#635bff;
                        "
                    >

                        <i class="bi bi-send-fill"></i>

                    </button>

                </form>

            </div>

        </div>

    </main>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script
    type="module"
    src="js/message.js"
></script>


</body>

</html>
