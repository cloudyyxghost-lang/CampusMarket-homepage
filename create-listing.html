<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Listing - CampusMarket</title>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- =====================================================
         BOOTSTRAP ICONS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- =====================================================
         GOOGLE FONT
    ====================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="bg-white">


    <!-- =====================================================
         PAGE CONTAINER
    ====================================================== -->

    <div class="container-fluid min-vh-100">


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav
            class="navbar navbar-expand-lg px-3 px-md-5 py-3"
        >

            <div class="container-fluid">


                <!-- =========================================
                     LOGO
                ========================================== -->

                <a
                    href="index.html"
                    class="navbar-brand d-flex align-items-center gap-2 fw-bold"
                    style="
                        font-family: 'Space Grotesk', sans-serif;
                        font-size: 25px;
                    "
                >

                    <span
                        class="d-flex align-items-center justify-content-center rounded-3 text-white"
                        style="
                            width: 42px;
                            height: 42px;
                            background-color: #635bff;
                        "
                    >

                        <i class="bi bi-mortarboard-fill"></i>

                    </span>


                    CampusMarket

                </a>


                <!-- =========================================
                     BACK TO STORE
                ========================================== -->

                <a
                    href="seller-dashboard.html"
                    class="btn btn-outline-secondary rounded-3"
                >

                    <i
                        class="bi bi-arrow-left me-1"
                    ></i>

                    My Store

                </a>

            </div>

        </nav>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main
            class="container-fluid px-3 px-md-5 pb-5"
        >


            <!-- =================================================
                 BLUE STORE CREATION CONTAINER
            ================================================== -->

            <div
                class="rounded-5 p-4 p-md-5"
                style="
                    background-color: #d8e9f8;
                    border: 1px solid #b7cde2;
                "
            >


                <!-- =================================================
                     PAGE TITLE
                ================================================== -->

                <h1
                    class="fw-bold mb-4"
                    style="
                        font-family: 'Space Grotesk', sans-serif;
                    "
                >

                    Store Creation

                </h1>


                <!-- =================================================
                     CREATE LISTING FORM
                ================================================== -->

                <form
                    id="createListingForm"
                    novalidate
                >


                    <div class="row g-4">


                        <!-- =========================================
                             LEFT SIDE - IMAGES
                        ========================================== -->

                        <div class="col-lg-6">


                            <div
                                class="bg-white border border-dark rounded-4 p-4 h-100"
                            >


                                <h5
                                    class="fw-bold mb-3"
                                >

                                    Images

                                </h5>


                                <p
                                    class="text-secondary small"
                                >

                                    Add up to 8 image URLs for your item.

                                </p>


                                <!-- =================================
                                     IMAGE URL INPUT
                                ================================== -->

                                <div
                                    class="input-group mb-3"
                                >

                                    <span
                                        class="input-group-text bg-white"
                                    >

                                        <i
                                            class="bi bi-link-45deg"
                                        ></i>

                                    </span>


                                    <input
                                        type="url"
                                        id="imageUrlInput"
                                        class="form-control"
                                        placeholder="Paste image URL"
                                    >


                                    <button
                                        type="button"
                                        id="addImageButton"
                                        class="btn btn-dark"
                                    >

                                        Add

                                    </button>

                                </div>


                                <!-- =================================
                                     URL EXAMPLE
                                ================================== -->

                                <div
                                    class="alert alert-light border small"
                                >

                                    <i
                                        class="bi bi-info-circle me-1"
                                    ></i>

                                    Example:

                                    <br>

                                    <span class="text-secondary">

                                        https://example.com/my-image.jpg

                                    </span>

                                </div>


                                <!-- =================================
                                     IMAGE PREVIEW
                                ================================== -->

                                <div
                                    id="imagePreviewContainer"
                                    class="row g-3 mt-2"
                                >

                                    <!-- Images will appear here -->

                                </div>


                                <!-- =================================
                                     IMAGE COUNT
                                ================================== -->

                                <div
                                    id="imageCount"
                                    class="small text-secondary mt-3"
                                >

                                    0 / 8 images

                                </div>

                            </div>

                        </div>


                        <!-- =========================================
                             RIGHT SIDE - ITEM DETAILS
                        ========================================== -->

                        <div class="col-lg-6">


                            <div
                                class="bg-white border border-dark rounded-4 p-4"
                            >


                                <!-- =================================
                                     ITEM NAME
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="itemName"
                                        class="form-label fw-bold"
                                    >

                                        Name

                                    </label>


                                    <input
                                        type="text"
                                        id="itemName"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="What are you selling?"
                                        required
                                    >

                                </div>


                                <!-- =================================
                                     DETAILS
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="description"
                                        class="form-label fw-bold"
                                    >

                                        Details

                                    </label>


                                    <textarea
                                        id="description"
                                        class="form-control rounded-3"
                                        rows="5"
                                        placeholder="Describe the item, condition, age, features, etc."
                                        required
                                    ></textarea>

                                </div>


                                <!-- =================================
                                     PRICE
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="price"
                                        class="form-label fw-bold"
                                    >

                                        Price

                                    </label>


                                    <div
                                        class="input-group input-group-lg"
                                    >

                                        <span
                                            class="input-group-text"
                                        >

                                            $

                                        </span>


                                        <input
                                            type="number"
                                            id="price"
                                            class="form-control"
                                            min="0"
                                            step="0.01"
                                            placeholder="0.00"
                                            required
                                        >

                                    </div>

                                </div>


                                <!-- =================================
                                     STATUS
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="status"
                                        class="form-label fw-bold"
                                    >

                                        Status

                                    </label>


                                    <select
                                        id="status"
                                        class="form-select form-select-lg rounded-3"
                                    >

                                        <option
                                            value="active"
                                        >
                                            Active
                                        </option>


                                        <option
                                            value="draft"
                                        >
                                            Draft
                                        </option>

                                    </select>

                                </div>


                                <!-- =================================
                                     SCHOOL
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="school"
                                        class="form-label fw-bold"
                                    >

                                        School

                                    </label>


                                    <input
                                        type="text"
                                        id="school"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Your school"
                                        required
                                    >

                                </div>


                                <!-- =================================
                                     CATEGORY
                                ================================== -->

                                <div class="mb-4">

                                    <label
                                        for="category"
                                        class="form-label fw-bold"
                                    >

                                        Category

                                    </label>


                                    <select
                                        id="category"
                                        class="form-select form-select-lg rounded-3"
                                        required
                                    >

                                        <option
                                            value=""
                                        >
                                            Select category
                                        </option>


                                        <option
                                            value="Computers"
                                        >
                                            Computers
                                        </option>


                                        <option
                                            value="Books"
                                        >
                                            Books
                                        </option>


                                        <option
                                            value="Uniforms"
                                        >
                                            Uniforms
                                        </option>


                                        <option
                                            value="Backpacks"
                                        >
                                            Backpacks
                                        </option>


                                        <option
                                            value="School Supplies"
                                        >
                                            School Supplies
                                        </option>


                                        <option
                                            value="Games"
                                        >
                                            Games
                                        </option>


                                        <option
                                            value="Other"
                                        >
                                            Other
                                        </option>

                                    </select>

                                </div>


                                <!-- =================================
                                     CONDITION
                                ================================== -->

                                <div>

                                    <label
                                        for="condition"
                                        class="form-label fw-bold"
                                    >

                                        Condition

                                    </label>


                                    <select
                                        id="condition"
                                        class="form-select form-select-lg rounded-3"
                                        required
                                    >

                                        <option
                                            value=""
                                        >
                                            Select condition
                                        </option>


                                        <option
                                            value="New"
                                        >
                                            New
                                        </option>


                                        <option
                                            value="Like New"
                                        >
                                            Like New
                                        </option>


                                        <option
                                            value="Excellent"
                                        >
                                            Excellent
                                        </option>


                                        <option
                                            value="Good"
                                        >
                                            Good
                                        </option>


                                        <option
                                            value="Fair"
                                        >
                                            Fair
                                        </option>

                                    </select>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- =================================================
                         LOCATION
                    ================================================== -->

                    <div
                        class="bg-white border border-dark rounded-4 p-4 mt-4"
                    >

                        <div class="row g-3">


                            <!-- LOCATION -->

                            <div class="col-md-6">

                                <label
                                    for="location"
                                    class="form-label fw-bold"
                                >

                                    Location

                                </label>


                                <input
                                    type="text"
                                    id="location"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="City / Region"
                                    required
                                >

                            </div>


                            <!-- PICKUP -->

                            <div class="col-md-6">

                                <label
                                    for="pickup"
                                    class="form-label fw-bold"
                                >

                                    Pickup Information

                                </label>


                                <input
                                    type="text"
                                    id="pickup"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="Optional pickup information"
                                >

                            </div>

                        </div>

                    </div>


                    <!-- =================================================
                         ERROR MESSAGE
                    ================================================== -->

                    <div
                        id="createError"
                        class="alert alert-danger d-none mt-4"
                        role="alert"
                    ></div>


                    <!-- =================================================
                         SUCCESS MESSAGE
                    ================================================== -->

                    <div
                        id="createSuccess"
                        class="alert alert-success d-none mt-4"
                        role="alert"
                    ></div>


                    <!-- =================================================
                         CONTINUE BUTTON
                    ================================================== -->

                    <div
                        class="text-center mt-4"
                    >

                        <button
                            type="submit"
                            id="publishButton"
                            class="btn btn-lg bg-white border border-dark rounded-pill px-5 py-3"
                        >

                            Continue

                            <i
                                class="bi bi-arrow-right ms-2"
                            ></i>

                        </button>

                    </div>


                </form>

            </div>

        </main>

    </div>


    <!-- =====================================================
         BOOTSTRAP JAVASCRIPT
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         CREATE LISTING JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/create-listing.js"
    ></script>

</body>

</html>
