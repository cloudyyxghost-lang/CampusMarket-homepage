<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Listing - CampusMarket</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


    <!-- =====================================================
         OUTER CONTAINER
    ====================================================== -->

    <div
        class="container-fluid border border-dark rounded-5 min-vh-100 my-3 bg-white"
        style="width: calc(100% - 48px);"
    >


        <!-- =================================================
             NAVIGATION
        ================================================== -->

        <nav
            class="navbar navbar-expand-lg px-3 px-md-5 py-4"
        >

            <div class="container-fluid px-0">


                <!-- LOGO -->

                <a
                    href="index.html"
                    class="navbar-brand d-flex align-items-center gap-2 fw-bold"
                    style="
                        font-family: 'Space Grotesk', sans-serif;
                        font-size: 26px;
                    "
                >

                    <span
                        class="d-flex align-items-center justify-content-center rounded-3 text-white"
                        style="
                            width: 42px;
                            height: 42px;
                            background-color: #635bff;
                        "
                    >

                        <i class="bi bi-mortarboard-fill"></i>

                    </span>


                    <span>
                        CampusMarket
                    </span>

                </a>


                <!-- BACK BUTTON -->

                <a
                    href="seller-dashboard.html"
                    class="btn btn-outline-dark rounded-3"
                >

                    <i class="bi bi-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>

        </nav>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main
            class="container px-3 px-md-5 py-4 pb-5"
            style="max-width: 1100px;"
        >


            <!-- PAGE TITLE -->

            <div class="mb-4">

                <h1
                    class="fw-bold"
                    style="
                        font-family: 'Space Grotesk', sans-serif;
                    "
                >
                    Create New Listing
                </h1>


                <p class="text-secondary">

                    Sell an item to your school community.

                </p>

            </div>


            <!-- =================================================
                 FORM
            ================================================== -->

            <form id="listingForm">


                <div class="row g-4">


                    <!-- =========================================
                         LEFT COLUMN
                    ========================================== -->

                    <div class="col-lg-7">


                        <!-- ITEM INFORMATION CARD -->

                        <div
                            class="card border-0 shadow-sm rounded-4 mb-4"
                        >

                            <div class="card-body p-4">


                                <h4
                                    class="fw-bold mb-4"
                                    style="
                                        font-family: 'Space Grotesk', sans-serif;
                                    "
                                >
                                    Item Information
                                </h4>


                                <!-- ITEM NAME -->

                                <div class="mb-3">

                                    <label
                                        for="itemName"
                                        class="form-label fw-semibold"
                                    >
                                        Item Name
                                    </label>


                                    <input
                                        type="text"
                                        id="itemName"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="e.g. MacBook Air M2"
                                        required
                                    >

                                </div>


                                <!-- DESCRIPTION -->

                                <div class="mb-3">

                                    <label
                                        for="itemDescription"
                                        class="form-label fw-semibold"
                                    >
                                        Description
                                    </label>


                                    <textarea
                                        id="itemDescription"
                                        class="form-control rounded-3"
                                        rows="5"
                                        placeholder="Describe the item, condition, accessories, etc."
                                        required
                                    ></textarea>

                                </div>


                                <!-- CATEGORY -->

                                <div class="mb-3">

                                    <label
                                        for="itemCategory"
                                        class="form-label fw-semibold"
                                    >
                                        Category
                                    </label>


                                    <select
                                        id="itemCategory"
                                        class="form-select form-select-lg rounded-3"
                                        required
                                    >

                                        <option
                                            value=""
                                            selected
                                            disabled
                                        >
                                            Select a category
                                        </option>

                                        <option value="Computers">
                                            Computers
                                        </option>

                                        <option value="Books">
                                            Books
                                        </option>

                                        <option value="Uniform">
                                            Uniform
                                        </option>

                                        <option value="School Supplies">
                                            School Supplies
                                        </option>

                                        <option value="Games">
                                            Games
                                        </option>

                                        <option value="Electronics">
                                            Electronics
                                        </option>

                                        <option value="Sports">
                                            Sports
                                        </option>

                                        <option value="Other">
                                            Other
                                        </option>

                                    </select>

                                </div>


                                <!-- CONDITION -->

                                <div class="mb-3">

                                    <label
                                        for="itemCondition"
                                        class="form-label fw-semibold"
                                    >
                                        Condition
                                    </label>


                                    <select
                                        id="itemCondition"
                                        class="form-select form-select-lg rounded-3"
                                        required
                                    >

                                        <option
                                            value=""
                                            selected
                                            disabled
                                        >
                                            Select condition
                                        </option>

                                        <option value="New">
                                            New
                                        </option>

                                        <option value="Like New">
                                            Like New
                                        </option>

                                        <option value="Good">
                                            Good
                                        </option>

                                        <option value="Fair">
                                            Fair
                                        </option>

                                        <option value="Used">
                                            Used
                                        </option>

                                    </select>

                                </div>


                                <!-- PRICE -->

                                <div class="mb-3">

                                    <label
                                        for="itemPrice"
                                        class="form-label fw-semibold"
                                    >
                                        Price
                                    </label>


                                    <div class="input-group input-group-lg">

                                        <span
                                            class="input-group-text rounded-start-3"
                                        >
                                            $
                                        </span>


                                        <input
                                            type="number"
                                            id="itemPrice"
                                            class="form-control rounded-end-3"
                                            placeholder="0.00"
                                            min="0"
                                            step="0.01"
                                            required
                                        >

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- LOCATION CARD -->

                        <div
                            class="card border-0 shadow-sm rounded-4"
                        >

                            <div class="card-body p-4">


                                <h4
                                    class="fw-bold mb-4"
                                    style="
                                        font-family: 'Space Grotesk', sans-serif;
                                    "
                                >
                                    Location
                                </h4>


                                <!-- SCHOOL -->

                                <div class="mb-3">

                                    <label
                                        for="itemSchool"
                                        class="form-label fw-semibold"
                                    >
                                        School
                                    </label>


                                    <input
                                        type="text"
                                        id="itemSchool"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="Your school"
                                        required
                                    >

                                </div>


                                <!-- LOCATION -->

                                <div class="mb-3">

                                    <label
                                        for="itemLocation"
                                        class="form-label fw-semibold"
                                    >
                                        Location
                                    </label>


                                    <input
                                        type="text"
                                        id="itemLocation"
                                        class="form-control form-control-lg rounded-3"
                                        placeholder="e.g. Los Angeles"
                                        required
                                    >

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- =========================================
                         RIGHT COLUMN
                    ========================================== -->

                    <div class="col-lg-5">


                        <!-- IMAGE CARD -->

                        <div
                            class="card border-0 shadow-sm rounded-4 mb-4"
                        >

                            <div class="card-body p-4">


                                <h4
                                    class="fw-bold mb-4"
                                    style="
                                        font-family: 'Space Grotesk', sans-serif;
                                    "
                                >
                                    Item Image
                                </h4>


                                <!-- IMAGE URL -->

                                <label
                                    for="itemImageURL"
                                    class="form-label fw-semibold"
                                >
                                    Image URL
                                </label>


                                <input
                                    type="url"
                                    id="itemImageURL"
                                    class="form-control form-control-lg rounded-3"
                                    placeholder="https://example.com/image.jpg"
                                >


                                <div
                                    class="form-text mb-3"
                                >

                                    Paste a direct URL to your image.

                                    <br>

                                    No image upload is required.

                                </div>


                                <!-- IMAGE PREVIEW -->

                                <div
                                    id="imagePreviewContainer"
                                    class="border rounded-4 overflow-hidden bg-light d-flex align-items-center justify-content-center"
                                    style="
                                        height: 300px;
                                    "
                                >

                                    <div
                                        id="imagePlaceholder"
                                        class="text-center text-secondary"
                                    >

                                        <i
                                            class="bi bi-image fs-1 d-block mb-2"
                                        ></i>


                                        <span>
                                            Image preview
                                        </span>

                                    </div>


                                    <img
                                        id="imagePreview"
                                        src=""
                                        alt="Image Preview"
                                        class="d-none w-100 h-100"
                                        style="
                                            object-fit: cover;
                                        "
                                    >

                                </div>

                            </div>

                        </div>


                        <!-- SELLER INFORMATION -->

                        <div
                            class="card border-0 shadow-sm rounded-4 mb-4"
                        >

                            <div class="card-body p-4">

                                <h4
                                    class="fw-bold mb-3"
                                    style="
                                        font-family: 'Space Grotesk', sans-serif;
                                    "
                                >
                                    Seller
                                </h4>


                                <div
                                    class="d-flex align-items-center gap-3"
                                >

                                    <div
                                        class="rounded-circle d-flex align-items-center justify-content-center"
                                        style="
                                            width: 48px;
                                            height: 48px;
                                            background-color: #eeeaff;
                                            color: #635bff;
                                        "
                                    >

                                        <i
                                            class="bi bi-person-fill fs-4"
                                        ></i>

                                    </div>


                                    <div>

                                        <div
                                            id="sellerNameDisplay"
                                            class="fw-semibold"
                                        >
                                            Loading...
                                        </div>


                                        <div
                                            id="sellerSchoolDisplay"
                                            class="small text-secondary"
                                        >
                                            Loading...
                                        </div>

                                    </div>

                                </div>

                            </div>

                        </div>


                        <!-- ERROR -->

                        <div
                            id="listingError"
                            class="alert alert-danger d-none"
                            role="alert"
                        ></div>


                        <!-- SUCCESS -->

                        <div
                            id="listingSuccess"
                            class="alert alert-success d-none"
                            role="alert"
                        ></div>


                        <!-- CREATE BUTTON -->

                        <button
                            type="submit"
                            id="createListingButton"
                            class="btn btn-lg w-100 text-white rounded-4 py-3 fw-semibold"
                            style="
                                background-color: #635bff;
                                border-color: #635bff;
                            "
                        >

                            <i
                                class="bi bi-plus-circle me-2"
                            ></i>

                            Create Listing

                        </button>

                    </div>

                </div>

            </form>

        </main>

    </div>


    <!-- =====================================================
         BOOTSTRAP
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- =====================================================
         CREATE LISTING JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/create-listing.js"
    ></script>


</body>

</html>
