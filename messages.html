<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Messages - CampusMarket</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div
    class="container-fluid border border-dark rounded-5 min-vh-100 my-3 bg-white"
    style="width: calc(100% - 48px);"
>


    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav
        class="navbar navbar-expand-lg px-3 px-md-5 py-4"
    >

        <div class="container-fluid px-0">


            <a
                href="index.html"
                class="navbar-brand d-flex align-items-center gap-2 fw-bold"
                style="
                    font-family: 'Space Grotesk', sans-serif;
                    font-size: 26px;
                "
            >

                <span
                    class="d-flex align-items-center justify-content-center rounded-3 text-white"
                    style="
                        width: 42px;
                        height: 42px;
                        background-color: #635bff;
                    "
                >

                    <i class="bi bi-mortarboard-fill"></i>

                </span>

                CampusMarket

            </a>


            <div
                class="d-flex align-items-center gap-2"
            >

                <a
                    href="index.html"
                    class="btn btn-outline-dark rounded-3"
                >

                    <i class="bi bi-shop me-1"></i>

                    Marketplace

                </a>


                <a
                    href="seller-dashboard.html"
                    class="btn btn-outline-dark rounded-3"
                >

                    Dashboard

                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main
        class="container px-3 px-md-5 py-4"
        style="max-width: 1000px;"
    >


        <div class="mb-4">

            <h1
                class="fw-bold"
                style="
                    font-family: 'Space Grotesk', sans-serif;
                "
            >

                Messages

            </h1>


            <p class="text-secondary">

                Communicate with buyers and sellers.

            </p>

        </div>


        <!-- =================================================
             CONVERSATIONS
        ================================================== -->

        <div
            id="conversationList"
            class="d-flex flex-column gap-2"
        >

            <!-- Conversations inserted by JavaScript -->

        </div>


        <!-- =================================================
             EMPTY STATE
        ================================================== -->

        <div
            id="emptyMessages"
            class="text-center py-5"
        >

            <div
                class="d-flex align-items-center justify-content-center rounded-4 mx-auto mb-3"
                style="
                    width: 72px;
                    height: 72px;
                    background-color: #eeeaff;
                    color: #635bff;
                "
            >

                <i class="bi bi-chat-dots fs-2"></i>

            </div>


            <h4 class="fw-bold">

                No messages yet

            </h4>


            <p class="text-secondary">

                Your conversations with buyers and sellers
                will appear here.

            </p>

        </div>


        <!-- ERROR -->

        <div
            id="messagesError"
            class="alert alert-danger d-none"
        ></div>

    </main>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<script
    type="module"
    src="js/messages.js"
></script>


</body>

</html>
